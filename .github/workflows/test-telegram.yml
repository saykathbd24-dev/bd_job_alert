name: Test Telegram Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one Telegram test message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get('BOT_TOKEN', '').strip()
          chat = os.environ.get('CHAT_ID', '').strip()
          if not token or not chat:
              raise SystemExit('BOT_TOKEN or CHAT_ID is missing from repository Actions secrets.')

          url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = urllib.parse.urlencode({
              'chat_id': chat,
              'text': '✅ BD Govt Job Alert: Telegram connection successful! GitHub Actions test message.'
          }).encode('utf-8')

          try:
              with urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=25) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              try:
                  reply = json.load(error)
              except (ValueError, OSError):
                  reply = {}
              reason = reply.get('description', 'Please check the bot token and chat ID.')
              raise SystemExit(f'Telegram error HTTP {error.code}: {reason}') from None
          except urllib.error.URLError:
              raise SystemExit('Network connection to Telegram failed.') from None

          if not result.get('ok'):
              raise SystemExit('Telegram did not accept the test message.')
          print('Success: test message sent to Telegram.')
          PY
